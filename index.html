<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bubble Wrap">
    <meta name="description" content="Pop bubbles and relax! A satisfying bubble wrap popping game for iPhone and all devices.">
    <meta name="theme-color" content="#667eea">

    <title>Bubble Wrap - Pop & Relax</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">

    <!-- Favicon and Apple Touch Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Install Prompt -->
    <div id="installPrompt" class="install-prompt hidden">
        <div class="install-content">
            <span class="install-icon">📱</span>
            <div class="install-text">
                <strong data-i18n="installTitle">Install Bubble Wrap</strong>
                <p data-i18n="installDesc">Add to home screen for the best experience!</p>
            </div>
            <button id="installBtn" class="install-btn" data-i18n="installBtn">Install</button>
            <button id="dismissInstall" class="dismiss-btn">✕</button>
        </div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1 data-i18n="title">🫧 Bubble Wrap</h1>

            <!-- Stats -->
            <div class="stats">
                <span class="counter"><span data-i18n="popped">Popped</span>: <span id="popCount">0</span>/<span id="totalCount">0</span></span>
                <span class="lifetime-counter"><span data-i18n="allTime">All Time</span>: <span id="lifetimeCount">0</span></span>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <!-- Timer (for challenge mode) -->
            <div id="timerDisplay" class="timer hidden">
                <span data-i18n="time">Time</span>: <span id="timerValue">30</span>s
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="resetBtn" class="control-btn reset-btn" data-i18n="reset">🔄 Reset</button>
            <button id="soundToggle" class="control-btn" data-i18n="sound">🔊 Sound</button>
            <button id="vibrationToggle" class="control-btn" data-i18n="vibration">📳 Vibration</button>
            <button id="themeBtn" class="control-btn" data-i18n="theme">🎨 Theme</button>
            <button id="languageBtn" class="control-btn" data-i18n="language">🌐 EN</button>
            <button id="settingsBtn" class="control-btn" data-i18n="settings">⚙️ Settings</button>
        </div>

        <!-- Bubble Grid -->
        <div id="bubbleGrid" class="bubble-grid"></div>

        <!-- Footer -->
        <div class="footer">
            <p id="footerText" data-i18n="footerClassic">Tap bubbles to pop them! 🎉</p>
            <button id="shareBtn" class="share-btn" data-i18n="share">📤 Share</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2 data-i18n="settingsTitle">⚙️ Settings</h2>
                <button id="closeSettings" class="close-btn">✕</button>
            </div>

            <div class="modal-body">
                <!-- Theme Selection -->
                <div class="setting-group">
                    <h3 data-i18n="themeSection">🎨 Theme</h3>
                    <div class="theme-buttons">
                        <button class="theme-btn" data-theme="purple" data-i18n="themePurple">Purple</button>
                        <button class="theme-btn" data-theme="ocean" data-i18n="themeOcean">Ocean</button>
                        <button class="theme-btn" data-theme="sunset" data-i18n="themeSunset">Sunset</button>
                        <button class="theme-btn" data-theme="forest" data-i18n="themeForest">Forest</button>
                        <button class="theme-btn" data-theme="dark" data-i18n="themeDark">Dark</button>
                    </div>
                </div>

                <!-- Bubble Size -->
                <div class="setting-group">
                    <h3 data-i18n="sizeSection">📏 Bubble Size</h3>
                    <div class="size-buttons">
                        <button class="size-btn" data-size="small" data-i18n="sizeSmall">Small</button>
                        <button class="size-btn" data-size="medium" data-i18n="sizeMedium">Medium</button>
                        <button class="size-btn" data-size="large" data-i18n="sizeLarge">Large</button>
                    </div>
                </div>

                <!-- Game Mode -->
                <div class="setting-group">
                    <h3 data-i18n="modeSection">🎮 Game Mode</h3>
                    <div class="mode-buttons">
                        <button class="mode-btn" data-mode="classic" data-i18n="modeClassic">Classic</button>
                        <button class="mode-btn" data-mode="timed" data-i18n="modeTimed">Timed (30s)</button>
                        <button class="mode-btn" data-mode="endless" data-i18n="modeEndless">Endless</button>
                    </div>
                </div>

                <!-- Statistics -->
                <div class="setting-group">
                    <h3 data-i18n="statsSection">📊 Statistics</h3>
                    <div class="stats-display">
                        <p><span data-i18n="totalPops">Total Pops</span>: <strong id="totalPops">0</strong></p>
                        <p><span data-i18n="gamesCompleted">Games Completed</span>: <strong id="gamesCompleted">0</strong></p>
                        <p><span data-i18n="bestTime">Best Time</span>: <strong id="bestTime">--</strong></p>
                        <button id="clearStats" class="clear-stats-btn" data-i18n="clearStats">Clear Stats</button>
                    </div>
                </div>

                <!-- Audio/Vibration -->
                <div class="setting-group">
                    <h3 data-i18n="prefsSection">🔊 Preferences</h3>
                    <label class="toggle-label">
                        <input type="checkbox" id="soundEnabled" checked>
                        <span data-i18n="soundEffects">Sound Effects</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="vibrationEnabled" checked>
                        <span data-i18n="vibrationPref">Vibration</span>
                    </label>
                    <label class="toggle-label">
                        <input type="checkbox" id="comboEnabled" checked>
                        <span data-i18n="comboMessages">Combo Messages</span>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Confetti Canvas -->
    <canvas id="confettiCanvas"></canvas>

    <script src="game.js"></script>
</body>
</html>
